name: Build Niko APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: تثبيت Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: بناء APK
        run: buildozer android debug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Niko-debug
          path: bin/*.apk
